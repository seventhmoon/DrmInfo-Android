# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Enable parallel project execution and build caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX and AGP settings
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=false
android.nonFinalResIds=true

# Build feature defaults
android.defaults.buildfeatures.resvalues=true
android.dependency.useConstraints=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Disable R8 full mode to prevent issues with reflection and field access
android.enableR8.fullMode=false
