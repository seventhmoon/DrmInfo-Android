# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Enable parallel project execution and build caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX and AGP settings
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Build feature defaults
android.dependency.useConstraints=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Enable R8 full mode for optimal memory, APK size, and startup performance
android.enableR8.fullMode=true
