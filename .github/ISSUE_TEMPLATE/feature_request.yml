name: 💡 Feature Request
description: Propose a new feature, new DRM scheme support, or UI enhancement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      placeholder: "A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]"
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the feature or solution you'd like
      placeholder: "A clear and concise description of what you want to happen."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context or Hardware Details
      placeholder: "Add any other context, API references, or screenshots about the feature request."
    validations:
      required: false
