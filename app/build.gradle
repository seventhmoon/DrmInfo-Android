plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.android.gms.strict-version-matcher-plugin'
    id 'com.google.firebase.crashlytics'
    id 'com.google.firebase.firebase-perf'
}

android {
    compileSdkVersion("android-S")
//    compileSdkVersion 30
    buildToolsVersion '31.0.0 rc5'

    defaultConfig {
        applicationId 'com.androidfung.drminfo'
        minSdkVersion 24
        targetSdkVersion 30
//        targetSdkVersion("S")
        versionCode 334
        versionName '1.1.8.210607'

        multiDexEnabled false
        vectorDrawables.useSupportLibrary = true
        resConfig "en"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField("String", "API_KEY", "\"AIzaSyCj2e4iUMxwxqJ8H87-VbcVhD1A0fDbljk\"")
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            versionNameSuffix ".debug"
            debuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
//        viewBinding = true
//        compose = true
        dataBinding = true
    }

    signingConfigs {
        config {
            enableV3Signing(true)
            enableV4Signing(true)
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled false
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
        useIR = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion compose_version
        kotlinCompilerVersion kotlin_version
    }

    lintOptions {
        abortOnError false
        textReport true
        textOutput 'stdout'
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation "androidx.activity:activity-ktx:1.2.3"
    implementation "androidx.annotation:annotation:1.2.0"
    implementation "androidx.appcompat:appcompat:1.3.0"
    implementation "androidx.appcompat:appcompat-resources:1.3.0"
//    implementation "androidx.compose.ui:ui:$compose_version"
//    implementation "androidx.compose.material:material:$compose_version"
    implementation "androidx.collection:collection-ktx:1.1.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.0-beta02"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.1.0"
    implementation "androidx.core:core-ktx:1.6.0"
    implementation "androidx.fragment:fragment-ktx:1.3.5"
    implementation "androidx.leanback:leanback:1.1.0-rc01"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.transition:transition:1.4.1"
//    implementation "androidx.ui:ui-tooling:$compose_version"
    implementation "androidx.vectordrawable:vectordrawable:1.1.0"
    implementation "androidx.work:work-runtime-ktx:2.7.0-alpha04"

    implementation "com.google.android:flexbox:1.1.1"
//    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation "com.google.android.gms:play-services-ads:20.2.0"
    implementation "com.google.android.gms:play-services-safetynet:17.0.1"
    implementation "com.google.android.material:material:1.4.0"

//    implementation "com.google.firebase:firebase-ads:20.1.0"
    implementation "com.google.firebase:firebase-analytics-ktx:19.0.0"
    implementation "com.google.firebase:firebase-config-ktx:21.0.0"
    implementation "com.google.firebase:firebase-crashlytics-ktx:18.1.0"
    implementation "com.google.firebase:firebase-perf-ktx:20.0.2"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    testImplementation "androidx.arch.core:core-testing:2.1.0"
    testImplementation "junit:junit:4.13.2"

    androidTestImplementation "androidx.test.ext:junit:1.1.3"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.4.0"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

