plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.android.gms.strict-version-matcher-plugin'
    id 'com.google.firebase.crashlytics'
    id 'com.google.firebase.firebase-perf'
}

android {
    compileSdkVersion 31
    buildToolsVersion '31.0.0'

    defaultConfig {
        applicationId 'com.androidfung.drminfo'
        minSdkVersion 24
        targetSdkVersion 31
        versionCode 349
        versionName '1.1.8.210731'

        multiDexEnabled false
        vectorDrawables.useSupportLibrary = true
        resConfig "en"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

//        buildConfigField("String", "API_KEY", "\"AIzaSyCj2e4iUMxwxqJ8H87-VbcVhD1A0fDbljk\"")
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            versionNameSuffix ".debug"
            debuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        dataBinding = true
        compose false
    }

    signingConfigs {
        config {
            enableV3Signing(true)
            enableV4Signing(true)
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled false
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
        useIR = true
    }

//    composeOptions {
//        kotlinCompilerExtensionVersion compose_version
//        kotlinCompilerVersion kotlin_version
//    }

    lintOptions {
        abortOnError false
        textReport true
        textOutput 'stdout'
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation "androidx.activity:activity-ktx:1.3.0"
//    implementation 'androidx.activity:activity-compose:1.3.0-rc01'
    implementation "androidx.annotation:annotation:1.2.0"
    implementation "androidx.appcompat:appcompat:1.3.1"
    implementation "androidx.appcompat:appcompat-resources:1.3.1"
//    implementation "androidx.compose.material:material:$compose_version"
//    implementation "androidx.compose.ui:ui:$compose_version"
//    implementation "androidx.compose.ui:ui-tooling:$compose_version"
    implementation "androidx.collection:collection-ktx:1.1.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.1.0"
    implementation "androidx.core:core-ktx:1.6.0"
    implementation "androidx.fragment:fragment-ktx:1.3.6"
    implementation "androidx.leanback:leanback:1.1.0-rc02"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.transition:transition:1.4.1"
    implementation "androidx.vectordrawable:vectordrawable:1.1.0"
    constraints {
        implementation('androidx.work:work-runtime:2.7.0-alpha05')
    }

    implementation "com.google.android:flexbox:1.1.1"
//    implementation 'com.google.android:flexbox:2.0.1'
//    implementation "com.google.android.gms:play-services-safetynet:17.0.1"
    implementation "com.google.android.gms:play-services-ads:20.2.0"

    implementation "com.google.android.material:material:1.5.0-alpha01"

    implementation "com.google.firebase:firebase-analytics-ktx:19.0.0"
    implementation 'com.google.firebase:firebase-appcheck:16.0.0-beta02'
    implementation 'com.google.firebase:firebase-appcheck-safetynet:16.0.0-beta02'
    implementation "com.google.firebase:firebase-crashlytics-ktx:18.2.0"
    implementation "com.google.firebase:firebase-perf-ktx:20.0.2"
//    implementation "com.google.firebase:firebase-config-ktx:21.0.0"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    testImplementation "androidx.arch.core:core-testing:2.1.0"
    testImplementation "junit:junit:4.13.2"

    androidTestImplementation "androidx.test.ext:junit:1.1.3"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.4.0"
//    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_version"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

