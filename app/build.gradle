plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
    id 'com.google.android.gms.strict-version-matcher-plugin'
    id 'com.google.firebase.crashlytics'
    id 'com.google.firebase.firebase-perf'
}

android {
    compileSdk 33
    buildToolsVersion '33.0.1'

    defaultConfig {
        applicationId 'com.androidfung.drminfo'
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 411
        versionName '1.1.11.230503'

        multiDexEnabled false
        vectorDrawables.useSupportLibrary = true
        resConfigs 'en'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

//        buildConfigField("String", "API_KEY", "\"AIzaSyCj2e4iUMxwxqJ8H87-VbcVhD1A0fDbljk\"")
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            versionNameSuffix ".debug"
            debuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        dataBinding true
        compose true
    }

    signingConfigs {
        config {
            enableV3Signing(true)
            enableV4Signing(true)
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled false
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.4.7"
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
        textOutput file('stdout')
        textReport true
    }
    namespace 'com.androidfung.drminfo'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation "androidx.activity:activity-ktx:1.7.1"
    implementation 'androidx.activity:activity-compose:1.7.1'
    implementation "androidx.annotation:annotation:1.6.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.appcompat:appcompat-resources:1.6.1"
    implementation "androidx.compose.ui:ui:1.4.3"
    implementation "androidx.compose.material:material:1.4.3"
    implementation "androidx.compose.material3:material3:1.0.1"
    implementation "androidx.compose.ui:ui-tooling-preview:1.4.3"
    implementation "androidx.collection:collection-ktx:1.2.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"
    implementation "androidx.core:core-ktx:1.10.0"
    implementation "androidx.fragment:fragment-ktx:1.5.7"
    implementation "androidx.leanback:leanback:1.1.0-rc02"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.6.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1"
    implementation "androidx.transition:transition:1.4.1"
    implementation "androidx.vectordrawable:vectordrawable:1.1.0"
    implementation "androidx.window:window:1.0.0"

    implementation "com.google.android.gms:play-services-ads:22.0.0"
    implementation "com.google.android.material:material:1.8.0"

    implementation "com.google.firebase:firebase-analytics-ktx:21.2.2"
    implementation "com.google.firebase:firebase-crashlytics-ktx:18.3.7"
    implementation "com.google.firebase:firebase-perf-ktx:20.3.2"
//    implementation "com.google.firebase:firebase-config-ktx:21.0.1"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.21"

    testImplementation "androidx.arch.core:core-testing:2.2.0"
    testImplementation "junit:junit:4.13.2"

    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.4.3"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.3"
    debugImplementation "androidx.compose.ui:ui-tooling:1.4.3"
}

